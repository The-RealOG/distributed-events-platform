name: Deliberate breaks

# Proves the delivery-guarantee tests catch the bugs they exist for: each job applies one
# mutation from scripts/mutations/mutations.mjs and passes only if the targeted real
# PostgreSQL/Kafka tests then FAIL (the baseline job: only if they pass). Manual; not on PRs.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Group of deliberate breaks to run (empty = all): outbox, consumers, activity, cache, realtime, attachments, api'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - id: ids
        run: echo "ids=$(node scripts/mutations/run.mjs --list '${{ inputs.group }}')" >> "$GITHUB_OUTPUT"

  mutation:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.list.outputs.ids) }}
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/mutations/run.mjs ${{ matrix.id }}
