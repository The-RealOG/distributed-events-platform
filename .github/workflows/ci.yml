name: CI

# Every pull request and every push to main. No AWS access: CI never touches the dev environment.
#
#   plan ──────────────► integration (matrix of balanced shards, affected-only off main)
#   static  (format, lint, typecheck)          ┐
#   unit    (unit + architecture guards, build) ├ in parallel, no Docker
#   security (npm audit, gitleaks)             ┘
#   images  (Dockerfile lint, build, non-root and no-npm checks, vulnerability scan)
#
# Turbo's local cache is persisted between runs, so unchanged packages are not re-linted,
# re-typechecked or re-built. Integration results are never cached (turbo.json).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Concise logs on success; failures still print their full output.
  TURBO_OUTPUT_LOGS: errors-only

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - id: plan
        run: >-
          node scripts/ci/plan.mjs "${{ github.event_name }}" "${{ github.ref }}"
          "${{ github.event.pull_request.base.sha || github.event.before }}"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}
          # This job's own latest cache first (it holds this job's task results), then any.
          restore-keys: |
            turbo-static-
            turbo-
      - run: npm ci
      - run: npm run format:check
      - run: npx turbo run lint typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-unit-${{ github.sha }}
          # This job's own latest cache first (it holds this job's task results), then any.
          restore-keys: |
            turbo-unit-
            turbo-
      - run: npm ci
      # Unit and component tests plus the architecture guards (tests/architecture, never cached).
      # Full test output (not errors-only) so every run records each package's executed test count.
      - run: npx turbo run test build --output-logs=full

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Dependency audit (production dependencies; reads the lockfile, no install needed)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v

  # The production images, built on the runner (never on a developer machine). Two represent all
  # eight: every backend service uses node-service.Dockerfile, and the web app has its own.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              image: project-service,
              dockerfile: node-service.Dockerfile,
              args: "APP=@dpp/project-service\nAPP_DIR=apps/project-service",
            }
          - { image: web, dockerfile: web.Dockerfile, args: 'VITE_API_BASE_URL=/api' }
    name: images (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x hadolint
          ./hadolint infrastructure/docker/${{ matrix.dockerfile }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          tags: dpp/${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Runs as a non-root user without package managers
        run: |
          uid=$(docker run --rm --entrypoint id dpp/${{ matrix.image }}:ci -u)
          echo "uid=$uid"; [ "$uid" != "0" ]
          if docker run --rm --entrypoint sh dpp/${{ matrix.image }}:ci -c 'command -v npm || command -v npx'; then
            echo "package manager present in the runtime image"; exit 1
          fi
      - name: Vulnerability scan (fails on fixable HIGH or CRITICAL)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz | tar xz trivy
          ./trivy image --no-progress --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 dpp/${{ matrix.image }}:ci

  # Real PostgreSQL/Kafka/Valkey via Testcontainers. Shards run in parallel on separate runners;
  # each suite keeps its own containers and isolation, exactly as before.
  integration:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: integration (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
      # Start pulling the pinned test images while dependencies install (Testcontainers joins an
      # in-progress pull instead of starting another).
      - name: Pre-pull container images
        run: |
          for image in postgres:17-alpine apache/kafka:4.1.1 valkey/valkey:8-alpine localstack/localstack:4.14.0 testcontainers/ryuk:0.14.0; do
            nohup docker pull -q "$image" > /dev/null 2>&1 &
          done
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-integration-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-integration-${{ matrix.shard }}-
            turbo-
      - run: npm ci
      - run: npx turbo run test:integration ${{ matrix.filters }} --concurrency=1 --output-logs=full
