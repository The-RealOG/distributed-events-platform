name: End-to-end (Playwright)

# Browser tests against the real Docker Compose stack, including the specs that stop
# containers (PostgreSQL and Kafka outages). Building the seven service images takes several
# minutes, so this runs nightly and on demand rather than on every push. No AWS access.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Run the browser tests
        run: npm run test:e2e
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            tests/test-results/
            compose.log
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v
