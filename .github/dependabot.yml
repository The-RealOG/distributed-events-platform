# Weekly update proposals as pull requests; CI decides whether each one is safe to merge.
# Grouped so a week's updates arrive as a few PRs rather than dozens.
version: 2
updates:
  # Base images in infrastructure/docker/*.Dockerfile (pinned to exact versions).
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ['*'] }
    ignore:
      # Odd nginx minors are mainline; stay on the stable line.
      - dependency-name: nginxinc/nginx-unprivileged
        versions: ['1.31.x']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
    # Major versions change behaviour and are upgraded deliberately, one at a time.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # npm workspaces share the root lockfile, so the root directory covers every package.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
